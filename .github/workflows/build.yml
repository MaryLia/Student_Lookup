name: Build

# Builds the standalone app for Windows and macOS. PyInstaller cannot
# cross-compile, so each platform is built on its own runner.
#
# - Runs on every push / PR touching the app (sanity check that it still builds).
# - Uploads the built apps as workflow artifacts you can download from the run.
# - On a version tag (e.g. "v2.0.0"), also attaches them to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Student_Lookup-windows.zip
          - os: macos-13          # Intel build (also runs on Apple Silicon via Rosetta)
            asset: Student_Lookup-macos-intel.zip
          - os: macos-14          # Apple Silicon build
            asset: Student_Lookup-macos-applesilicon.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python build_app.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a ../${{ matrix.asset }} Student_Lookup.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Student_Lookup.app ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
